apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-fitness-gym-candidate
  namespace: aceest
  labels:
    app: aceest-fitness-gym
    deployment: candidate
spec:
  replicas: 1
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: aceest-fitness-gym
      deployment: candidate
  template:
    metadata:
      labels:
        app: aceest-fitness-gym
        deployment: candidate
    spec:
      containers:
        - name: aceest-fitness-gym
          image: aceest-fitness-gym:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: DEPLOYMENT_VARIANT
              value: candidate
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
